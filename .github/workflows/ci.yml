name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build dashboard CSS
        run: npm run build:css

      - name: Verify generated dashboard CSS is committed
        run: git diff --exit-code -- src/issuedeck/features/dashboard/static/css/dashboard.css

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -x -q

      - name: Build package
        run: uv build

      - name: Build Docker image
        run: docker build -t issuedeck:ci .
