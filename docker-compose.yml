services:
  issuedeck:
    build: .
    container_name: issuedeck
    restart: unless-stopped
    ports:
      - "${ISSUEDECK_PORT:-8765}:8765"
    volumes:
      - issuedeck-data:/app/data
      - ./projects:/app/projects:ro
      - ./server.toml:/app/server.toml:ro
    environment:
      - ISSUEDECK_API_TOKEN=${ISSUEDECK_API_TOKEN:-change-me}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  issuedeck-data:
