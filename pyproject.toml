[project]
name = "issuedeck"
version = "0.3.2"
description = "Local-first issue deck for AI coding agents and human developers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "IssueDeck contributors" },
]
keywords = ["developer-tools", "issue-tracker", "mcp", "fastapi", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "httpx>=0.27",
    "fastmcp>=2.0",
    "python-frontmatter>=1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/xq520mmy/IssueDeck"
Repository = "https://github.com/xq520mmy/IssueDeck"
Issues = "https://github.com/xq520mmy/IssueDeck/issues"
Changelog = "https://github.com/xq520mmy/IssueDeck/blob/main/CHANGELOG.md"
Documentation = "https://github.com/xq520mmy/IssueDeck#readme"

[project.scripts]
issuedeck = "issuedeck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issuedeck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
